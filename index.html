<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX Quantum Mining</title>

    <!-- 1. Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- 2. Adsgram SDK for Rewarded Ads -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px 24px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f8fafc;
        }

        .card p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 16px;
            font-size: 0.875rem;
            min-height: 20px;
        }

        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="card">
        <h1>TMX Quantum Mining</h1>
        <p>Watch a rewarded ad to mine and claim your TMX tokens securely!</p>
        
        <button id="adBtn" class="btn-primary" onclick="handleWatchAdAndClaim()">
            Watch Ad & Claim TMX
        </button>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        // Initialize Telegram WebApp SDK
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Configuration
        const ADSGRAM_BLOCK_ID = "40165"; // Replace with your Adsgram Block ID from publisher.adsgram.ai
        const BACKEND_URL = "https://tmx-quantum-api.vercel.app/api/grant-reward";

        async function handleWatchAdAndClaim() {
            const btn = document.getElementById("adBtn");
            const status = document.getElementById("statusMsg");

            status.textContent = "";
            status.className = "status-msg";

            // Check Adsgram SDK availability
            if (typeof Adsgram === "undefined") {
                status.textContent = "Adsgram SDK failed to load. Check your internet or ad blocker.";
                status.className = "status-msg error";
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = "Loading Ad...";

                // Initialize Adsgram controller
                const AdController = Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

                // Show ad modal to user
                const result = await AdController.show();

                // User successfully watched the full ad
                if (result.done) {
                    status.textContent = "Ad completed! Verifying reward with backend...";
                    btn.textContent = "Verifying...";

                    // Send Telegram initData to backend API for verification and reward payout
                    const response = await fetch(BACKEND_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            initData: tg?.initData || ""
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        status.textContent = `Success! Claimed ${data.reward_amount || 100} TMX!`;
                        status.className = "status-msg success";
                    } else {
                        status.textContent = data.detail || "Reward validation failed.";
                        status.className = "status-msg error";
                    }
                }
            } catch (err) {
                // User closed early, ad failed, or network error
                if (err && err.error) {
                    status.textContent = `Ad issue: ${err.description || "Ad closed before completion."}`;
                } else {
                    status.textContent = "An unexpected error occurred.";
                }
                status.className = "status-msg error";
            } finally {
                btn.disabled = false;
                btn.textContent = "Watch Ad & Claim TMX";
            }
        }
    </script>
</body>
</html>
