<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TMX Quantum Shop</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #000000);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .card {
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>TMX Quantum Shop</h2>
    
    <div class="card">
      <p id="user-greeting">Loading user data...</p>
      <p id="status-message">Connected to <strong>@Tmxqunbot</strong></p>
    </div>

    <button class="btn" id="checkout-btn">Complete Purchase</button>
  </div>

  <script>
    // Initialize Telegram WebApp SDK
    const tg = window.Telegram.WebApp;

    // Expand Mini App to full height
    tg.expand();

    // Display user information securely provided by Telegram SDK
    const user = tg.initDataUnsafe?.user;
    const greetingEl = document.getElementById('user-greeting');
    
    if (user) {
      greetingEl.innerText = `Welcome, ${user.first_name}!`;
    } else {
      greetingEl.innerText = `Welcome to TMX Quantum Shop!`;
    }

    // Configure Telegram Main Button
    tg.MainButton.setText("CHECKOUT NOW");
    tg.MainButton.show();

    // Handle Main Button / Purchase Click
async function handleCheckout() {
  tg.MainButton.showProgress();

  try {
    const response = await fetch('/api/shop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        initData: tg.initData,
        userId: user?.id,
        action: 'checkout'
      })
    });

    // Check if the response is actually JSON before parsing
    const contentType = response.headers.get("content-type");
    if (!contentType || !contentType.includes("application/json")) {
      const text = await response.text();
      tg.showAlert(`Server returned non-JSON error (${response.status}): ${text.substring(0, 100)}`);
      return;
    }

    const result = await response.json();

    if (response.ok && result.success) {
      tg.showAlert('Order placed successfully!');
      tg.close();
    } else {
      tg.showAlert('Server Error: ' + (result.message || 'Unknown error'));
    }
  } catch (err) {
    tg.showAlert('Network Error: ' + err.message);
  } finally {
    tg.MainButton.hideProgress();
  }
}

    tg.MainButton.onClick(handleCheckout);
    document.getElementById('checkout-btn').addEventListener('click', handleCheckout);
  </script>
</body>
</html>
