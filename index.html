<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMX-QUANTUM Mining</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #0088cc;
    }
    p {
      color: #aaaaaa;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 0;
      margin-top: 20px;
      background-color: #0088cc;
      color: #ffffff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>TMX-QUANTUM Mining</h1>
    <p>Protocol designed for max yield without battery drain.</p>
    
    <button class="btn" id="action-btn" onclick="triggerBackendAction()">Perform Secured Action</button>
  </div>

  <script>
    const BOT_USERNAME = 'tmxquantum_bot';
    const APP_SHORT_NAME = 'app';
    // Replace with your actual backend URL after deployment
    const BACKEND_URL = 'https://your-backend-domain.com'; 

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    async function triggerBackendAction() {
      const tg = window.Telegram?.WebApp;
      const user = tg?.initDataUnsafe?.user;

      if (!user) {
        alert("Please open this app inside Telegram.");
        return;
      }

      try {
        // Send request to your OWN secure backend instead of Telegram directly
        const response = await fetch(`${BACKEND_URL}/api/send-message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: tg.initData, // Pass validation payload
            chatId: user.id,
            message: `Hello ${user.first_name}, your quantum mining action was received securely!`
          })
        });

        const result = await response.json();
        if (result.success) {
          tg.showAlert("Action completed safely!");
        } else {
          alert("Error: " + result.error);
        }
      } catch (err) {
        console.error("Backend error:", err);
      }
    }
  </script>

</body>
</html>
