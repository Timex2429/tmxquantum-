<head>

    <style>
        :root {
            --bg-cosmic: #0c081e;
            --bg-panel: rgba(24, 13, 52, 0.78);
            --bg-surface: rgba(12, 8, 30, 0.85);
            --text-primary: #f8fafc;
            --text-muted: #a78bfa;
            --quantum-purple: #7b2cbf;
            --neural-cyan: #00f5ff;
            --electric-blue: #0088cc;
            --cyber-gold: #ffd700;
            --emerald-ok: #10b981;
            --danger-red: #ef4444;
            --border-quantum: rgba(123, 44, 191, 0.36);
            --border-cyan: rgba(0, 245, 255, 0.32);
            --glow-purple: 0 0 14px rgba(123, 44, 191, 0.45);
            --glow-cyan: 0 0 14px rgba(0, 245, 255, 0.38);
            --glow-gold: 0 0 14px rgba(255, 215, 0, 0.42);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-cosmic);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-image:
                radial-gradient(circle at 50% 8%, rgba(123, 44, 191, 0.24) 0%, transparent 48%),
                radial-gradient(circle at 85% 75%, rgba(0, 136, 204, 0.16) 0%, transparent 45%),
                linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
            display: flex;
            flex-direction: column;
        }

        /* Top Global Status Header */
        .global-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(16, 9, 38, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-quantum);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
            flex-shrink: 0;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            min-width: 0;
        }

        .brand-badge span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .balance-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--cyber-gold);
            background: rgba(255, 215, 0, 0.12);
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: var(--glow-gold);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* Diagnostic Error Banner (Only shown if an error occurs) */
        #runtime-error-banner {
            display: none;
            margin: 10px 16px 0;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(239, 68, 68, 0.16);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fecaca;
            font-size: 12px;
            line-height: 1.4;
        }

        /* Scrollable Main Content */
        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 88px;
        }

        .view-section {
            display: none;
            flex-direction: column;
            gap: 14px;
            max-width: 480px;
            margin: 0 auto;
        }

        .view-section.active {
            display: flex;
        }

        /* Telemetry Stats Row */
        .header-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: var(--bg-panel);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-quantum);
            box-shadow: var(--glow-purple);
        }

        .stat-box {
            background: var(--bg-surface);
            border: 1px solid rgba(123, 44, 191, 0.22);
            border-radius: 12px;
            padding: 8px 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--cyber-gold);
            margin-top: 3px;
        }

        /* Core Mining Reactor Button */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 18px 0;
            position: relative;
        }

        .game-container::before {
            content: "";
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 245, 255, 0.16) 0%, rgba(123, 44, 191, 0.18) 50%, transparent 72%);
            pointer-events: none;
        }

        .tap-button {
            position: relative;
            z-index: 1;
            width: 196px;
            height: 196px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #9d4edd 0%, #3c096c 55%, #12072b 100%);
            border: 3px solid var(--cyber-gold);
            box-shadow: 0 0 28px rgba(123, 44, 191, 0.55), inset 0 0 18px rgba(0, 245, 255, 0.28);
            cursor: pointer;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.08s ease;
            user-select: none;
        }

        .tap-button:active:not(:disabled) {
            transform: scale(0.93);
        }

        .tap-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .tap-icon {
            font-size: 52px;
            line-height: 1;
        }

        .tap-text {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 8px;
            letter-spacing: 0.6px;
        }

        .session-hint {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            z-index: 1;
        }

        /* Action Buttons */
        .controls, .stack-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 13px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease, opacity 0.2s ease;
            user-select: none;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--electric-blue), #005b8a);
            color: #ffffff;
            border-color: var(--border-cyan);
        }

        .btn-ad {
            background: linear-gradient(135deg, var(--cyber-gold), #ff9100);
            color: #0c081e;
            border-color: rgba(255, 245, 177, 0.7);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--emerald-ok), #047857);
            color: #ffffff;
            border-color: rgba(52, 211, 153, 0.5);
        }

        .btn-secondary {
            background: rgba(45, 23, 88, 0.75);
            color: var(--text-primary);
            border-color: var(--border-quantum);
        }

        /* Section Cards & Rows */
        .card {
            background: var(--bg-panel);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border-quantum);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card h3 {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-sub {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .list-item {
            background: var(--bg-surface);
            border: 1px solid var(--border-quantum);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .item-info h4 {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .item-info p {
            font-size: 12px;
            color: var(--cyber-gold);
            font-weight: 600;
        }

        .status-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .status-done {
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.16);
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .status-pending {
            color: var(--neural-cyan);
            background: rgba(0, 245, 255, 0.12);
            border: 1px solid rgba(0, 245, 255, 0.32);
        }

        /* Inputs & Textareas */
        .field-input, .field-textarea {
            width: 100%;
            padding: 10px 12px;
