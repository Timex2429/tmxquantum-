    <style>
        :root {
            /* TMX-QUANTUM Brand Color Palette */
            --bg-color: #0c081e; /* Deeper cosmic blue-violet */
            --card-bg: rgba(30, 16, 62, 0.5); /* Semi-transparent quantum purple */
            --text-color: #f8fafc;
            --text-secondary: #a78bfa; /* Lavender tint */
            --accent-color: #00f5ff; /* Neural Cyan */
            --accent-blue: #0088cc; /* Electric Blue */
            --accent-gold: #ffd700; /* Cyber Gold */
            --accent-purple: #7b2cbf; /* Quantum Purple */
            --border-color: rgba(123, 44, 191, 0.25); /* Glowing Purple Border */
            --border-glow: 0 0 8px rgba(123, 44, 191, 0.4);
            --neon-glow: 0 0 12px rgba(0, 245, 255, 0.5);
            --gold-glow: 0 0 12px rgba(255, 215, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(123, 44, 191, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 10% 80%, rgba(0, 136, 204, 0.1) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.007) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.007) 1px, transparent 1px);
            background-size: auto, auto, 20px 20px, 20px 20px; /* Futuristic cosmic grid overlay */
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Top Global Header */
        .global-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(20, 11, 46, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1.5px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), var(--border-glow);
            font-size: 14px;
            font-weight: 600;
        }

        .balance-pill {
            color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-shadow: 0 0 4px rgba(255, 215, 0, 0.3);
            box-shadow: inset 0 0 6px rgba(255, 215, 0, 0.1), var(--gold-glow);
        }

        /* Main Viewport Container */
        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }

        .view-section {
            display: none;
            flex-direction: column;
            gap: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        .view-section.active {
            display: flex;
        }

        /* Header Stats Grid (Game View) */
        .header-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            border: 1.5px solid var(--border-color);
            box-shadow: var(--border-glow);
            backdrop-filter: blur(4px);
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-gold);
            margin-top: 4px;
            text-shadow: 0 0 4px rgba(255, 215, 0, 0.4);
        }

        /* Game Canvas Container */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            position: relative;
        }

        /* Ambient Outer Glow for the Tap Button */
        .game-container::before {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(123, 44, 191, 0.25) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .tap-button {
            position: relative;
            z-index: 1;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #7b2cbf 0%, #1a083a 70%, #0c081e 100%);
            border: 3.5px solid var(--accent-gold);
            box-shadow: 
                0 0 35px rgba(123, 44, 191, 0.5), 
                inset 0 0 20px rgba(0, 245, 255, 0.25),
                var(--gold-glow);
            cursor: pointer;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.08s ease, box-shadow 0.1s ease;
        }

        .tap-button:active {
            transform: scale(0.92);
            box-shadow: 
                0 0 20px rgba(123, 44, 191, 0.4), 
                inset 0 0 10px rgba(0, 245, 255, 0.15),
                0 0 6px rgba(255, 215, 0, 0.3);
        }

        .tap-icon { 
            font-size: 56px;
            filter: drop-shadow(0 0 8px rgba(0, 245, 255, 0.6));
        }
        
        .tap-text {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-color);
            margin-top: 6px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6), 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        /* Controls Section */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease, filter 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary { 
            background: linear-gradient(135deg, #0088cc, #005580); 
            color: white; 
            border-color: #00f5ff;
        }
        .btn-primary:not(:disabled):hover {
            box-shadow: var(--neon-glow), 0 4px 12px rgba(0, 0, 0, 0.4);
        }
