<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX-QUANTUM</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK direct load -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body>

    <!-- Your HTML structure here -->

    <script>
        const ADSGRAM_BLOCK_ID = "YOUR_ACTUAL_BLOCK_ID_HERE"; // Replace with your Adsgram Block ID
        const BACKEND_URL = "https://tmx-quantum-api.vercel.app/api/grant-reward";

        let currentBalance = 0.0;
        const tg = window.Telegram?.WebApp;
        if (tg) tg.ready();

        // Helper function to dynamically load Adsgram if it wasn't preloaded
        function loadAdsgramScript() {
            return new Promise((resolve, reject) => {
                if (window.Adsgram) {
                    return resolve(window.Adsgram);
                }
                const existingScript = document.querySelector('script[src*="sad.adsgram.ai"]');
                if (existingScript) {
                    existingScript.onload = () => resolve(window.Adsgram);
                    existingScript.onerror = () => reject(new Error("Adsgram script failed to load"));
                } else {
                    const script = document.createElement("script");
                    script.src = "https://sad.adsgram.ai/js/sad.min.js";
                    script.async = true;
                    script.onload = () => resolve(window.Adsgram);
                    script.onerror = () => reject(new Error("Adsgram CDN blocked or offline"));
                    document.head.appendChild(script);
                }
            });
        }

        async function handleWatchAdAndClaim() {
            const btn = document.getElementById("adBtn");
            const status = document.getElementById("statusMsg");
            const balanceEl = document.getElementById("tokenBalance");

            status.textContent = "";
            status.className = "status-msg";

            try {
                btn.disabled = true;
                btn.textContent = "Loading Ad Provider...";

                // Ensure window.Adsgram exists
                if (typeof window.Adsgram === "undefined") {
                    await loadAdsgramScript();
                }

                if (typeof window.Adsgram === "undefined") {
                    throw new Error("Adsgram SDK unavailable");
                }

                btn.textContent = "Showing Ad...";

                // Initialize Adsgram controller
                const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
                const result = await AdController.show();

                if (result && result.done) {
                    status.textContent = "Ad completed! Granting tokens...";
                    btn.textContent = "Verifying...";

                    const res = await fetch(BACKEND_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ initData: tg?.initData || "" })
                    });

                    const data = await res.json();

                    if (res.ok && data.success) {
                        const reward = data.reward_amount || 100;
                        currentBalance += reward;
                        balanceEl.textContent = currentBalance.toFixed(2);
                        status.textContent = `🎉 Mined +${reward} TMX successfully!`;
                        status.className = "status-msg success";
                    } else {
                        status.textContent = data.detail || "Reward validation failed.";
                        status.className = "status-msg error";
                    }
                }
            } catch (err) {
                console.error("Adsgram Error:", err);
                status.textContent = err.message || "Adsgram SDK failed to load";
                status.className = "status-msg error";
            } finally {
                btn.disabled = false;
                btn.textContent = "⚡ Mine & Claim TMX";
            }
        }
    </script>
</body>
</html>
