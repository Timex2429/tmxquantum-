<script>
    // -------------------------------------------------------------
    // Application Configuration
    // -------------------------------------------------------------
    const CONFIG = {
        botUsername: "Tmxqunbot",
        adsgramBlockId: "40165",
        sessionDuration: 15, // seconds
        pointsPerTap: 1
    };

    // Safe Telegram WebApp Initialization
    let tg = { expand: () => {}, ready: () => {}, initDataUnsafe: {}, initData: "" };
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();
        }
    } catch (err) {
        console.error("Telegram WebApp SDK failed to initialize:", err);
    }

    // Extract Telegram User Data safely
    const user = tg.initDataUnsafe?.user || { id: "GUEST", first_name: "Player" };
    const initDataRaw = tg.initData || "";

    // Game State Variables
    let currentScore = 0;
    let totalBalance = 0;
    let timeLeft = CONFIG.sessionDuration;
    let gameActive = false;
    let timerInterval = null;
    let multiplier = 1;

    // Safe Adsgram SDK Controller Initialization
    let AdController = null;
    try {
        if (window.Adsgram) {
            AdController = window.Adsgram.init({ blockId: CONFIG.adsgramBlockId });
        } else {
            console.warn("Adsgram SDK script not detected on window.");
        }
    } catch (err) {
        console.error("Error initializing Adsgram Controller:", err);
    }

    // -------------------------------------------------------------
    // Core Game Mechanics
    // -------------------------------------------------------------
    function handleTap(event) {
        try {
            // Trigger haptic vibration on mobile devices
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred("light");
            }

            // Start game on first click
            if (!gameActive && timeLeft === CONFIG.sessionDuration) {
                startGame();
            }

            if (gameActive) {
                currentScore += (CONFIG.pointsPerTap * multiplier);
                document.getElementById("score").innerText = currentScore;
                createTapAnimation(event);
            }
        } catch (err) {
            console.error("Error handling tap event:", err);
        }
    }

    function startGame() {
        try {
            gameActive = true;
            document.getElementById("btn-label").innerText = "TAP FAST!";
            document.getElementById("claim-btn").disabled = true;
            document.getElementById("ad-btn").disabled = true;

            timerInterval = setInterval(() => {
                try {
                    timeLeft--;
                    document.getElementById("timer").innerText = `${timeLeft}s`;

                    if (timeLeft <= 0) {
                        endGame();
                    }
                } catch (timerErr) {
                    console.error("Error inside game loop interval:", timerErr);
                    clearInterval(timerInterval);
                }
            }, 1000);
        } catch (err) {
            console.error("Error starting game:", err);
        }
    }

    function endGame() {
        try {
            clearInterval(timerInterval);
            gameActive = false;
            document.getElementById("btn-label").innerText = "FINISHED";
            document.getElementById("tap-btn").disabled = true;

            // Enable post-game actions
            document.getElementById("claim-btn").disabled = false;
            if (AdController) {
                document.getElementById("ad-btn").disabled = false;
            }

            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred("success");
            }
        } catch (err) {
            console.error("Error ending game:", err);
        }
    }

    // Floating number visual effect
    function createTapAnimation(event) {
        try {
            const btn = document.getElementById("tap-btn");
            if (!btn) return;

            const rect = btn.getBoundingClientRect();
            
            const effect = document.createElement("div");
            effect.className = "tap-effect";
            effect.innerText = `+${CONFIG.pointsPerTap * multiplier}`;
            
            // Calculate tap coordinates safely
            const x = (event && event.clientX ? event.clientX : (rect.left + rect.width / 2)) - rect.left - 10;
            const y = (event && event.clientY ? event.clientY : (rect.top + rect.height / 2)) - rect.top - 20;
            
            effect.style.left = `${x}px`;
            effect.style.top = `${y}px`;
            
            btn.appendChild(effect);

            setTimeout(() => {
                try {
                    effect.remove();
                } catch (e) {
                    /* Element already removed */
                }
            }, 800);
        } catch (err) {
            console.error("Error creating tap animation:", err);
        }
    }

    // -------------------------------------------------------------
    // Monetization: Adsgram Rewarded Integration
    // -------------------------------------------------------------
    async function watchAdFor2x() {
        if (!AdController) {
            if (tg.showAlert) tg.showAlert("Ad network is unavailable or initializing. Please try again.");
            else alert("Ad network is unavailable or initializing. Please try again.");
            return;
        }

        try {
            const result = await AdController.show();
            if (result && result.done) {
                // Double score on completed ad view
                currentScore = currentScore * 2;
                multiplier = 2;
                document.getElementById("score").innerText = currentScore;
                document.getElementById("ad-btn").disabled = true;
                document.getElementById("ad-btn").innerText = "2X Applied! ✨";
                
                if (tg.showAlert) tg.showAlert("Awesome! Your score has been doubled!");
            }
        } catch (error) {
            console.error("Ad placement error or user dismissed ad:", error);
            if (tg.showAlert) tg.showAlert("Ad reward canceled or unavailable.");
        }
    }

    // -------------------------------------------------------------
    // Backend Data Sync Routines
    // -------------------------------------------------------------
    async function submitScore() {
        const claimBtn = document.getElementById("claim-btn");
        if (claimBtn) {
            claimBtn.disabled = true;
            claimBtn.innerText = "Syncing...";
        }

        try {
            // Post score payload to your FastAPI backend route
            const response = await fetch("/api/game/submit-score", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    user_id: user.id,
                    score: currentScore,
                    init_data: initDataRaw
                })
            });

            if (!response.ok) {
                throw new Error(`Server returned HTTP ${response.status}`);
            }

            const data = await response.json();

            if (data && data.success) {
                totalBalance += (data.tokens_earned || currentScore);
                document.getElementById("total-balance").innerText = totalBalance;
                if (tg.showAlert) tg.showAlert(`Successfully recorded! Earned ${data.tokens_earned || currentScore} tokens.`);
            } else {
                throw new Error("API reported failure or invalid payload structure.");
            }
        } catch (err) {
            console.warn("Backend sync failed or offline, applying local fallback:", err);
            totalBalance += currentScore;
            document.getElementById("total-balance").innerText = totalBalance;
            if (tg.showAlert) tg.showAlert(`Score saved locally: ${currentScore} points.`);
        } finally {
            try {
                resetGameUI();
            } catch (resetErr) {
                console.error("Error resetting game state:", resetErr);
            }
        }
    }

    function resetGameUI() {
        try {
            currentScore = 0;
            timeLeft = CONFIG.sessionDuration;
            multiplier = 1;

            document.getElementById("score").innerText = "0";
            document.getElementById("timer").innerText = `${CONFIG.sessionDuration}s`;
            document.getElementById("btn-label").innerText = "TAP TO START";
            
            document.getElementById("tap-btn").disabled = false;
            
            const claimBtn = document.getElementById("claim-btn");
            if (claimBtn) {
                claimBtn.disabled = true;
                claimBtn.innerText = "💾 Submit Score & Save";
            }
            
            const adBtn = document.getElementById("ad-btn");
            if (adBtn) {
                adBtn.disabled = true;
                adBtn.innerText = "📺 Watch Ad to 2X Score";
            }
        } catch (err) {
            console.error("Error updating reset UI elements:", err);
        }
    }
</script>
