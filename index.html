<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX Quantum Mining</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #151d30;
            --primary-blue: #3b82f6;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --accent-cyan: #38bdf8;
            --error-red: #ef4444;
            --success-green: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .balance-title {
            color: var(--accent-cyan);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 8px 0;
        }

        .balance-sub {
            color: var(--accent-cyan);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .action-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .action-desc {
            color: var(--text-sub);
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .btn-mine {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-mine:active {
            transform: scale(0.98);
        }

        .btn-mine:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 16px;
            font-size: 0.88rem;
            min-height: 20px;
        }

        .status-msg.error {
            color: var(--error-red);
        }

        .status-msg.success {
            color: var(--success-green);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Balance Card -->
        <div class="card">
            <div class="balance-title">TMX QUANTUM BALANCE</div>
            <div class="balance-amount" id="balance-el">0.00</div>
            <div class="balance-sub">$TMX Tokens Mined</div>
        </div>

        <!-- Ad Mining Action Card -->
        <div class="card">
            <h2 class="action-title">Rewarded Ad Mining</h2>
            <p class="action-desc">
                Watch a short ad to trigger the quantum miner and credit $TMX directly to your wallet.
            </p>
            
            <button id="mine-btn" class="btn-mine" onclick="handleMineAndClaim()">
                ⚡ Mine & Claim TMX
            </button>

            <div id="status-msg" class="status-msg"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://tmxquantum-9g87rdznr-apex-tmx.vercel.app/api/claim-reward";
        const ADSGRAM_BLOCK_ID = "40165";

        // Initialize Telegram WebApp UI
        document.addEventListener("DOMContentLoaded", () => {
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });

        // Main Mining & Ad Handler
        async function handleMineAndClaim() {
            const btn = document.getElementById("mine-btn");
            const status = document.getElementById("status-msg");
            const balanceEl = document.getElementById("balance-el");

            const tg = window.Telegram?.WebApp;
            const initData = tg?.initData || "";
            const userId = tg?.initDataUnsafe?.user?.id;

            if (!userId) {
                status.textContent = "Please open this app inside Telegram.";
                status.className = "status-msg error";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Loading Ad...";
            status.textContent = "Connecting to ad network...";
            status.className = "status-msg";

            try {
                if (!window.Adsgram) {
                    throw new Error("Adsgram SDK failed to load. Check AdBlock/VPN.");
                }

                // 1. Initialize Adsgram Controller
                const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

                // 2. Show Ad
                const result = await AdController.show();

                // 3. Process Reward if watched
                if (result && result.done) {
                    status.textContent = "Ad finished! Claiming $TMX...";

                    const response = await fetch(BACKEND_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            telegram_id: String(userId),
                            init_data: initData
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        status.textContent = "Reward claimed successfully!";
                        status.className = "status-msg success";
                        if (balanceEl && data.new_balance !== undefined) {
                            balanceEl.textContent = data.new_balance;
                        }
                    } else {
                        status.textContent = data.detail || "Claim failed. Try again.";
                        status.className = "status-msg error";
                    }
                } else {
                    status.textContent = "Ad not finished. Watch completely to claim.";
                    status.className = "status-msg error";
                }
            } catch (error) {
                console.error("Adsgram / Mining Error:", error);
                status.textContent = error.message || "An error occurred while displaying the ad.";
                status.className = "status-msg error";
            } finally {
                btn.disabled = false;
                btn.textContent = "⚡ Mine & Claim TMX";
            }
        }
    </script>
</body>
</html>
